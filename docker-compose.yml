version: '3.8'

services:
  cli:
    build: .
    stdin_open: true
    tty: true
    volumes:
      - ./data:/app/data
    command: python cli.py -i
    profiles:
      - cli

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    profiles:
      - api

  web:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    command: streamlit run web_interface.py --server.port=8501 --server.address=0.0.0.0
    profiles:
      - web

  full:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./data:/app/data
    command: bash -c "uvicorn api:app --host 0.0.0.0 --port 8000 & streamlit run web_interface.py --server.port=8501 --server.address=0.0.0.0"
    profiles:
      - full